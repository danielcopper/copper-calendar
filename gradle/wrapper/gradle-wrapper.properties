# Gradle stays at 9.7.1: detekt's Gradle plugin calls Configuration.setVisible,
# which Gradle deprecates from 9.8, so newer Gradle prints deprecation warnings.
# Fixed upstream in https://github.com/detekt/detekt/pull/9577 (merged
# 2026-08-07, in no release yet; the latest is 2.0.0-alpha.6 of 2026-08-04).
# Raise Gradle once a detekt release contains that fix.
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
