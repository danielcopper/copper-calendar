[versions]
agp = "9.5.1"
# 2.4.20 is the newest Kotlin CodeQL's extractor supports (codeql.yml).
kotlin = "2.4.21"
androidx-core = "1.19.1"
androidsvg = "1.4"
junit = "4.13.2"
androidx-test-core = "1.7.0"
robolectric = "4.17"
ktlint-gradle = "14.2.0"
ktlint-cli = "1.8.0"
# 1.23.8, the last 1.x, uses Gradle APIs that Gradle 9 deprecates and parses
# with Kotlin 2.0; the 2.0 line is built against Kotlin 2.4.
detekt = "2.0.0-alpha.6"
sonarqube = "7.5.0.8588"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvg" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
