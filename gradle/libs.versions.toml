[versions]
agp = "9.5.1"
# 2.4.20 is the newest Kotlin CodeQL's extractor supports (codeql.yml; "Kotlin
# 1.8.0 to 2.4.20" for CodeQL CLI 2.27.4). Raise it once CodeQL's supported
# languages page names a newer one (and lift the ignores for the Kotlin Gradle
# plugin and its Compose and serialization plugins in .github/dependabot.yml).
kotlin = "2.4.20"
androidx-core = "1.19.1"
androidsvg = "1.4"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
work = "2.12.0"
okhttp = "5.5.1"
# 1.11.0, not 1.12.0 or 1.13.0: D44.
kotlinx-serialization = "1.11.0"
junit = "4.13.2"
androidx-test-core = "1.7.0"
robolectric = "4.17"
ktlint-gradle = "14.2.0"
ktlint-cli = "1.8.0"
# 1.23.8, the last 1.x, uses Gradle APIs that Gradle 9 deprecates and parses
# with Kotlin 2.0; the 2.0 line is built against Kotlin 2.4.
detekt = "2.0.0-alpha.6"
sonarqube = "7.5.0.8588"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidsvg = { module = "com.caverock:androidsvg-aar", version.ref = "androidsvg" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
