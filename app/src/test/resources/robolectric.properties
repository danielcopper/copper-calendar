# A phone-sized screen, a Pixel 6's 411 x 914 dp, so the bitmap limit the
# widgets read from it (BitmapLimit.limitBytes) is in proportion to a phone's
# at the test's density, not to Robolectric's default 320 x 470 dp. A test's
# own qualifiers add to it with a leading "+".
qualifiers=w411dp-h914dp
