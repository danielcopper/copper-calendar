name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  JAVA_VERSION: "21.0.11+10"  # mise.toml's JDK

# The jobs run what `mise run gate` runs locally, split so each check reports
# on its own. The runner's preinstalled Android SDK (ANDROID_HOME) stands in
# for `mise run setup`; AGP installs a missing SDK package itself.
jobs:
  build:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the debug APK, run the unit and render tests
        run: ./gradlew assembleDebug testDebugUnitTest
      - name: Upload the render test's PNGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render
          path: app/build/render/
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Android Lint, ktlint and detekt, warnings as errors
        run: ./gradlew lint ktlintCheck detekt

  # Runs on every push to main and every pull request whose head is a branch of
  # this repository. A fork's run gets no secrets, so a fork's PR is not
  # scanned. A Dependabot PR's run reads SONAR_TOKEN from the repository's
  # Dependabot secrets, not its Actions secrets.
  sonarcloud:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar needs full history to attribute new code to the right commits.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Coverage and the SonarQube Cloud scan
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
