version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Held at the wrapper's version; gradle-wrapper.properties says why and
      # until when.
      - dependency-name: gradle-wrapper
      # Held at the catalog's Kotlin; gradle/libs.versions.toml says why and
      # until when.
      - dependency-name: org.jetbrains.kotlin:kotlin-gradle-plugin
